<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu tarjeta de MVP — IM SPORTS</title>
  <meta property="og:title" content="Fuiste el MVP — IM SPORTS">
  <meta property="og:description" content="Abre la app para ver tu tarjeta de MVP y compartirla.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IM SPORTS">
  <meta property="og:locale" content="es_CL">
  <meta name="apple-itunes-app" content="app-id=6761868170">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #FF6B35;
      --bg: #0A0A0A;
      --surface: #1C1C1E;
      --text: #FFFFFF;
      --muted: #A0A0A0;
      --green: #00E676;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .logo { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 28px; }
    .logo-icon {
      background: var(--green); color: #0A0A0A; font-weight: 800;
      font-size: 18px; padding: 6px 10px; border-radius: 8px;
    }
    .logo-word { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
    h1 { font-size: 26px; margin: 0 0 12px; line-height: 1.2; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; }
    .btn {
      display: block; width: 100%; background: var(--accent); color: #fff;
      text-decoration: none; padding: 14px 18px; border-radius: 12px;
      font-weight: 700; font-size: 16px; margin-bottom: 10px;
    }
    .btn-secondary {
      display: block; width: 100%; background: transparent; color: #fff;
      text-decoration: none; padding: 12px 18px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16); font-weight: 600; margin-bottom: 10px;
    }
    .hint { font-size: 13px; color: #6B6B6B; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">IM</span>
      <span class="logo-word">SPORTS</span>
    </div>
    <h1>Tu tarjeta de MVP</h1>
    <p>Si tienes la app, ábrela para ver la tarjeta y compartirla. Si no, descárgala y entra con el mismo enlace.</p>
    <a class="btn" id="open-app" href="#">Abrir en IM SPORTS</a>
    <a class="btn-secondary" href="https://apps.apple.com/app/id6761868170">Descargar para iOS</a>
    <a class="btn-secondary" href="https://play.google.com/store/apps/details?id=cl.imsports.app">Descargar para Android</a>
    <p class="hint">IM SPORTS · imsports.app</p>
  </div>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var matchId = parts[0] === 'match' && parts[1] ? parts[1] : '';
      var card = new URLSearchParams(location.search).get('card') || 'mvp';
      var path = matchId ? '/match/' + encodeURIComponent(matchId) + '/share?card=' + encodeURIComponent(card) : '/';
      var scheme = 'imsports:/' + path;
      var btn = document.getElementById('open-app');
      btn.href = scheme;
      if (matchId) {
        // Intento de abrir la app; si no está, la persona queda en esta página.
        var timer = setTimeout(function () {}, 1500);
        window.location.href = scheme;
        clearTimeout(timer);
      }
    })();
  </script>
</body>
</html>
